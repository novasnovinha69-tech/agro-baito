<!doctype html><html><head><meta charset="utf-8"><title>Analisando...</title></head>
<body><script>
const url = "https://scontent.cdninstagram.com/v/t51.82787-19/591147082_18300098245280782_169867798056046839_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=100&ccb=9-4&oh=00_AfDeQxYqLpZhNXR7KvBQDXgW&oe=6A7B1234";
const img = new Image();
img.crossOrigin = "anonymous";
img.onload = () => {
  const c = document.createElement("canvas");
  c.width = 50; c.height = 50;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, 50, 50);
  const data = ctx.getImageData(0, 0, 50, 50).data;
  const contagem = {};
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    if (r > 240 && g > 240 && b > 240) continue;
    if (data[i+3] < 100) continue;
    const key = (Math.round(r/24)*24) + "," + (Math.round(g/24)*24) + "," + (Math.round(b/24)*24);
    contagem[key] = (contagem[key]||0) + 1;
  }
  const top = Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0, 8);
  document.title = "RESULTADO:" + JSON.stringify(top);
};
img.onerror = () => { document.title = "ERRO:nao carregou"; };
img.src = url;
</script></body></html>
