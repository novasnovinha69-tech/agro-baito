<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Agendamento enviado com sucesso | High Line Estética Automotiva</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Estilos específicos da página de confirmação */
    .confirm-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 110px 24px 60px;
      background: var(--gray-100);
    }
    .confirm-box {
      max-width: 640px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 48px 44px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .confirm-icon {
      width: 88px; height: 88px;
      margin: 0 auto 26px;
      display: grid; place-items: center;
      background: var(--gold-bg);
      color: var(--gold);
      font-size: 2.8rem;
      border-radius: 50%;
      border: 2px solid var(--gold);
    }
    .confirm-box h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: var(--black);
    }
    .confirm-box .lead {
      color: var(--gray-500);
      font-size: 1rem;
      margin-bottom: 32px;
      line-height: 1.65;
    }
    .summary {
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 26px;
      text-align: left;
      margin-bottom: 32px;
    }
    .summary h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 18px;
      font-weight: 700;
    }
    .summary dl { display: grid; gap: 13px; }
    .summary .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 13px;
      border-bottom: 1px dashed var(--gray-200);
    }
    .summary .row:last-child { border-bottom: none; padding-bottom: 0; }
    .summary dt { color: var(--gray-500); font-size: 0.9rem; }
    .summary dd { color: var(--black); font-weight: 600; font-size: 0.95rem; text-align: right; }
    .confirm-actions { display: flex; flex-direction: column; gap: 12px; }
    .confirm-actions .btn { width: 100%; }
    @media (max-width: 480px) {
      .confirm-box { padding: 36px 24px; }
      .confirm-box h1 { font-size: 1.55rem; }
      .summary { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- HEADER simples -->
  <header class="header" style="background: rgba(255,255,255,0.95); border-bottom: 1px solid var(--gray-200);">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="High Line Estética Automotiva" class="logo__img" />
      </a>
    </div>
  </header>

  <main class="confirm-page">
    <div class="confirm-box">
      <div class="confirm-icon"><i class="fa-solid fa-circle-check"></i></div>
      <h1>Agendamento enviado com sucesso!</h1>
      <p class="lead">Recebemos seu pedido. Em breve você receberá a confirmação no seu WhatsApp.</p>

      <div class="summary">
        <h2>Resumo do agendamento</h2>
        <dl id="summary"></dl>
      </div>

      <div class="confirm-actions">
        <a id="calendarLink" href="#" target="_blank" rel="noopener" class="btn btn--gold btn--lg">
          <i class="fa-solid fa-calendar-plus"></i> Adicionar ao Google Calendar
        </a>
        <a id="whatsLink" href="#" target="_blank" rel="noopener" class="btn btn--dark btn--lg">
          <i class="fa-brands fa-whatsapp"></i> Falar com a High Line no WhatsApp
        </a>
        <a href="index.html" class="btn btn--outline btn--lg">Voltar ao início</a>
      </div>
    </div>
  </main>

  <!-- WHATSAPP FLOAT -->
  <a href="https://wa.me/5547999661257" target="_blank" rel="noopener" class="whatsapp-float" aria-label="Falar no WhatsApp">
    <i class="fa-brands fa-whatsapp"></i><span class="whatsapp-float__pulse"></span>
  </a>

  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const nome = params.get('nome') || '—';
      const telefone = params.get('telefone') || '—';
      const veiculo = params.get('veiculo') || '—';
      const servico = params.get('servico') || '—';
      const preco = params.get('preco') || '';
      const data = params.get('data') || '';
      const horario = params.get('horario') || '—';
      const obs = params.get('obs') || '—';
      const wa = params.get('wa') || 'https://wa.me/5547999661257';

      // Formata data BR
      const dataBR = data ? (() => { const [y,m,d] = data.split('-'); return `${d}/${m}/${y}`; })() : '—';

      // ===== Resumo =====
      const summary = document.getElementById('summary');
      const rows = [
        ['Nome', nome],
        ['WhatsApp', telefone],
        ['Veículo', veiculo],
        ['Serviço', servico + (preco ? ` — R$ ${preco}` : '')],
        ['Data', dataBR],
        ['Horário', horario],
        ['Observações', obs]
      ];
      summary.innerHTML = rows.map(([k,v]) =>
        `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`
      ).join('');

      // ===== Link WhatsApp =====
      document.getElementById('whatsLink').href = wa;

      // ===== Google Calendar dinâmico =====
      // Formatar datas: AAAA-MM-DDTHH:MM:SS (início e fim estimado 2h)
      function toCalDate(dateStr, timeStr, addHours) {
        const [y,m,d] = dateStr.split('-').map(Number);
        const [hh,mm] = timeStr.split(':').map(Number);
        const dt = new Date(y, m-1, d, hh, mm);
        if (addHours) dt.setHours(dt.getHours() + addHours);
        const pad = n => String(n).padStart(2, '0');
        return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
      }
      const start = toCalDate(data, horario, 0);
      const end   = toCalDate(data, horario, 2);

      const titulo = `Agendamento High Line – ${servico}`;
      const local  = 'High Line Estética Automotiva – Porto Belo/SC';
      const detalhes =
`Serviço: ${servico} (R$ ${preco})
Cliente: ${nome}
Veículo: ${veiculo}
WhatsApp: ${telefone}
Observações: ${obs}

Endereço: Rua Izidoro Bernardino Batista, Porto Belo - SC, 88210-000
Telefone: (47) 99966-1257`;

      const calUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
        '&text=' + encodeURIComponent(titulo) +
        '&dates=' + start + '/' + end +
        '&details=' + encodeURIComponent(detalhes) +
        '&location=' + encodeURIComponent(local) +
        '&ctz=America/Sao_Paulo';

      document.getElementById('calendarLink').href = calUrl;

      // Ano no header/rodapé se houver
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
